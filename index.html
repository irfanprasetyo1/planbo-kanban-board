<!doctype html>
<html lang="en">
  <head>
    <!--Meta Tags-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planbo - Interactive Kanban Task Manager</title>
    <meta
      name="description"
      content="Planbo is a modern, interactive Kanban workspace designed for seamless task management. Drag, drop, and track your projects effortlessly."
    />
    <meta name="author" content="Planbo" />

    <!--Open Graph-->
    <meta
      property="og:title"
      content="Planbo - Interactive Kanban Task Manager"
    />
    <meta
      property="og:description"
      content="Planbo is a modern, interactive Kanban workspace designed for seamless task management. Drag, drop, and track your projects effortlessly."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="planbo" />
    <meta property="og:locale" content="id_ID" />

    <!--Favicon-->
    <link
      rel="shortcut icon"
      href="assets/logo/favicon.ico"
      type="image/x-icon"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />

    <!--Google Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!--Feather Icons-->
    <script src="https://unpkg.com/feather-icons"></script>

    <!--CSS Link-->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body>
    <!--Skip Link-->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!--Header & Navigation-->
    <header class="header">
      <div class="header-inner container">
        <div class="header-brand">
          <img
            src="assets/logo/logo.png"
            alt="Planbo logo"
            class="header-image"
          />
          <span>Plan<span class="header-title-accent">bo</span></span>
        </div>

        <nav class="board-switch" aria-label="Navigation board">
          <label for="boardSelect" class="sr-only">Select a board</label>
          <select id="boardSelect" aria-describedby="boardSelectHint"></select>
          <span id="boardSelectHint" class="sr-only"
            >Select the board you want to display</span
          >

          <button
            id="newBoardBtn"
            class="btn-icon"
            title="Create Board"
            aria-label="Create new board"
          >
            <i data-feather="plus" aria-hidden="true"></i>
          </button>

          <button
            class="btn-icon"
            id="deleteBoardBtn"
            title="Delete Board"
            aria-label="Delete current board"
          >
            <i data-feather="trash-2" aria-hidden="true"></i>
          </button>
        </nav>

        <div class="header-actions">
          <!--Statistics Button-->
          <button
            class="btn-icon"
            id="statBtn"
            title="Statistics"
            aria-label="View board statistics"
            aria-haspopup="dialog"
          >
            <i data-feather="bar-chart-2" aria-hidden="true"></i>
          </button>

          <!--Theme Button-->
          <button
            class="btn-icon"
            id="themeBtn"
            title="Choose theme"
            aria-label="Choose light/dark theme"
          >
            <i data-feather="moon" aria-hidden="true" id="themeIcon"></i>
          </button>
        </div>
      </div>
    </header>

    <!--Main Content-->
    <main class="main container" id="main-content">
      <section class="board-wrapper" aria-label="Kanban board" role="region">
        <div class="board" id="board" aria-live="polite"></div>
      </section>
    </main>

    <!--Overlay untuk statistics-->
    <div class="overlay" id="statOverlay" hidden></div>

    <!--Toolbar untuk Export , Import, dan Undo-->
    <div class="floating-toolbar" role="toolbar" aria-label="Board action">
      <!--Undo-->
      <button
        id="undoBtn"
        class="btn-icon"
        title="Undo"
        aria-label="Undo last action"
        disabled
      >
        <i data-feather="corner-up-left" aria-hidden="true"></i>
      </button>

      <!--Export-->
      <button
        id="exportBtn"
        class="btn-icon"
        title="Export"
        aria-label="Export board data"
      >
        <i data-feather="download" aria-hidden="true"></i>
      </button>

      <!--Import-->
      <button
        id="importBtn"
        class="btn-icon"
        title="Import"
        aria-label="Import board data"
      >
        <i data-feather="upload" aria-hidden="true"></i>
      </button>
      <input type="file" id="importInput" accept=".json" hidden />
    </div>

    <!--Statistics-->
    <div
      class="stats-dialog"
      id="statDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="statsTitle"
      hidden
    >
      <div class="stats-dialog-header">
        <h2 id="statsTitle">Statistics Board</h2>
        <button
          id="statCloseBtn"
          class="btn-icon"
          aria-label="Close statictics"
        >
          <i data-feather="x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="stats-dialog-body" id="statsBody"></div>
    </div>

    <!--Toast Notification-->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <i data-feather="check-circle" aria-hidden="true"></i>
      <span id="toastMessage">Success Action</span>
    </div>

    <!--Feather Icons-->
    <script>
      feather.replace();
    </script>

    <!--JavaScript-->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
